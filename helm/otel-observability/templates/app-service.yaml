apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: {{ include "otel-observability.namespace" . }}
  labels:
    {{- include "otel-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: {{ .Values.app.service.type }}
  selector:
    {{- include "otel-observability.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      {{- if eq .Values.app.service.type "NodePort" }}
      {{- if eq .Values.app.service.type "NodePort" }}
      nodePort: {{ .Values.app.service.nodePort }}
      {{- end }}
      {{- end }}
