apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: {{ include "otel-observability.namespace" . }}
spec:
  serviceName: loki
  replicas: {{ .Values.loki.replicas }}
  selector: { matchLabels: { app.kubernetes.io/component: loki } }
  template:
    metadata: { labels: { app.kubernetes.io/component: loki } }
    spec:
      containers:
        - name: loki
          image: "{{ .Values.images.loki.repository }}:{{ .Values.images.loki.tag }}"
          args: ["-config.file=/etc/loki/config.yaml"]
          ports: [{ name: http, containerPort: 3100 }]
          volumeMounts:
            - { name: config, mountPath: /etc/loki }
            - { name: data, mountPath: /loki }
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /ready, port: http }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: loki-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
