apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
  namespace: {{ include "otel-observability.namespace" . }}
spec:
  serviceName: jaeger
  replicas: {{ .Values.jaeger.replicas }}
  selector: { matchLabels: { app.kubernetes.io/component: jaeger } }
  template:
    metadata: { labels: { app.kubernetes.io/component: jaeger } }
    spec:
      containers:
        - name: jaeger
          image: "{{ .Values.images.jaeger.repository }}:{{ .Values.images.jaeger.tag }}"
          env:
            - { name: SPAN_STORAGE_TYPE, value: badger }
            - { name: BADGER_EPHEMERAL, value: "false" }
            - { name: BADGER_DIRECTORY_VALUE, value: /badger/data }
            - { name: BADGER_DIRECTORY_KEY, value: /badger/key }
            - { name: COLLECTOR_OTLP_ENABLED, value: "true" }
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
          volumeMounts: [{ name: data, mountPath: /badger }]
          readinessProbe: { httpGet: { path: /, port: ui }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /, port: ui }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.jaeger.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim: { claimName: jaeger-data }
          {{- else }}
          emptyDir: {}
          {{- end }}
