apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: {{ include "otel-observability.namespace" . }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    rule_files:
      - /etc/prometheus/rules/*.yml
    scrape_configs:
      - job_name: otel-collector
        static_configs: [{ targets: ["otel-collector:{{ .Values.collector.service.prometheusPort }}"] }]
      - job_name: springboot-actuator
        metrics_path: /actuator/prometheus
        static_configs: [{ targets: ["demo:{{ .Values.app.service.port }}"] }]
