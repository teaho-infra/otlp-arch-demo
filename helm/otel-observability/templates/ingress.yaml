{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-observability
  namespace: {{ include "otel-observability.namespace" . }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: grafana.{{ .Values.ingress.hostSuffix }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: grafana, port: { number: {{ .Values.grafana.service.port }} } } } }] }
    - host: prometheus.{{ .Values.ingress.hostSuffix }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: prometheus, port: { number: {{ .Values.prometheus.service.port }} } } } }] }
    - host: jaeger.{{ .Values.ingress.hostSuffix }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: jaeger, port: { number: {{ .Values.jaeger.service.uiPort }} } } } }] }
    - host: demo.{{ .Values.ingress.hostSuffix }}
      http: { paths: [{ path: /, pathType: Prefix, backend: { service: { name: demo, port: { number: {{ .Values.app.service.port }} } } } }] }
{{- end }}
