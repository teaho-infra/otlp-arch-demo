{{- if .Values.promtail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: {{ include "otel-observability.namespace" . }}
data:
  config.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://loki:{{ .Values.loki.service.port }}/loki/api/v1/push
    scrape_configs:
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: app
          - action: replace
            source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            separator: /
            replacement: /var/log/pods/*$1/*.log
            target_label: __path__
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: {{ include "otel-observability.namespace" . }}
  labels:
    {{- include "otel-observability.labels" . | nindent 4 }}
    app.kubernetes.io/component: promtail
spec:
  selector: { matchLabels: { app.kubernetes.io/component: promtail } }
  template:
    metadata: { labels: { app.kubernetes.io/component: promtail } }
    spec:
      serviceAccountName: promtail
      # Pod-level security context (runs once for the whole pod):
      # - runAsUser/runAsGroup match the host's containerd log writer
      # - nofile raises the per-pod file-descriptor limit so Promtail can
      #   tail logs from many containers without "too many open files".
      securityContext:
        {{- toYaml .Values.promtail.podSecurityContext | nindent 8 }}
      containers:
        - name: promtail
          image: "{{ .Values.images.promtail.repository }}:{{ .Values.images.promtail.tag }}"
          args: ["-config.file=/etc/promtail/config.yaml"]
          ports: [{ name: http, containerPort: 9080 }]
          volumeMounts:
            - { name: config, mountPath: /etc/promtail }
            - { name: positions, mountPath: /run/promtail }
            - { name: pods, mountPath: /var/log/pods, readOnly: true }
            {{- if ne .Values.promtail.containerLogsDir "/var/log/pods" }}
            - { name: containers, mountPath: {{ .Values.promtail.containerLogsDir }}, readOnly: true }
            {{- end }}
          readinessProbe: { httpGet: { path: /ready, port: http }, periodSeconds: 10 }
          resources:
            {{- toYaml .Values.promtail.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.promtail.securityContext | nindent 12 }}
      volumes:
        - name: config
          configMap: { name: promtail-config }
        - name: positions
          emptyDir: {}
        - name: pods
          hostPath: { path: /var/log/pods }
        {{- if ne .Values.promtail.containerLogsDir "/var/log/pods" }}
        - name: containers
          hostPath: { path: {{ .Values.promtail.containerLogsDir }} }
        {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: {{ include "otel-observability.namespace" . }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: promtail }
rules:
  - apiGroups: [""]
    resources: [pods, nodes, nodes/proxy]
    verbs: [get, watch, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: promtail }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: promtail }
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: {{ include "otel-observability.namespace" . }}
{{- end }}
