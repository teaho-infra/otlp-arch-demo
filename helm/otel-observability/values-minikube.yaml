global:
  namespace: observability

images:
  app:
    pullPolicy: IfNotPresent

persistence:
  enabled: true
  storageClass: standard

app:
  service:
    type: NodePort
    nodePort: 30080

prometheus:
  service:
    type: NodePort
    nodePort: 30090

grafana:
  service:
    type: NodePort
    nodePort: 30000

jaeger:
  service:
    type: NodePort
    uiNodePort: 30686
